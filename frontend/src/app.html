<!doctype html>
<html lang="en" class="font-sans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
		<!-- Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=%sveltekit.env.PUBLIC_GA_ID%"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', '%sveltekit.env.PUBLIC_GA_ID%');
		</script>
		<!-- End Google Analytics -->
		<!-- Google Ads -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=%sveltekit.env.PUBLIC_GOOGLE_ADS_ID%"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', '%sveltekit.env.PUBLIC_GOOGLE_ADS_ID%');
		</script>

		<!-- Google AdSense -->
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=%sveltekit.env.PUBLIC_ADSENSE_CLIENT%"
			crossorigin="anonymous"
		></script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div class="min-h-screen overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
