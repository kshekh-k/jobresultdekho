#version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - xyresults
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - xyresults
    restart: unless-stopped

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV}
      NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - "${STRAPI_PORT}:1337"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/public/uploads
    depends_on:
      - postgres
    networks:
      - xyresults
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # Node SSR
    networks:
      - xyresults
    restart: unless-stopped
    command: node build   # production Node server

networks:
  xyresults:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
