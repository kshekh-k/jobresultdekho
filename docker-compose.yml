services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No expose needed — containers on the same network communicate without it
    networks:
      - xyresults
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --protected-mode yes
    # No expose needed — containers on the same network communicate without it
    volumes:
      - redis_data:/data
    networks:
      - xyresults
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Must match backend/config/database.js — uses POSTGRES_* not DATABASE_*
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Bind to loopback only — Caddy on the same host proxies inward; never expose to 0.0.0.0
    ports:
      - "127.0.0.1:${STRAPI_PORT}:1337"
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xyresults
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: '1.0'
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /admin is a reliable Strapi endpoint; /_health does not exist by default
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:1337/admin || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=${API_URL}
      # PUBLIC_* vars are resolved at request-time by the Node adapter (not build-time)
      - PUBLIC_GA_ID=${PUBLIC_GA_ID}
      - PUBLIC_GOOGLE_ADS_ID=${PUBLIC_GOOGLE_ADS_ID}
      - PUBLIC_ADSENSE_CLIENT=${PUBLIC_ADSENSE_CLIENT}
    # Bind to loopback only — Caddy proxies; never expose raw Node to the internet
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    networks:
      - xyresults
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.5'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      strapi:
        condition: service_healthy

  # caddy:
  #   image: caddy:2.8-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - frontend
  #     - strapi
  #   networks:
  #     - xyresults
  #   restart: unless-stopped
  #   security_opt:
  #     - no-new-privileges:true

networks:
  xyresults:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
