# jobresultdekho.com — Frontend
server {
    listen 80;
    server_name jobresultdekho.com www.jobresultdekho.com;
    return 301 https://jobresultdekho.com$request_uri;
}

server {
    listen 443 ssl;
    server_name jobresultdekho.com;

    # SSL — update paths to your actual cert locations
    ssl_certificate     /etc/letsencrypt/live/jobresultdekho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobresultdekho.com/privkey.pem;

    # www → non-www
    if ($host = 'www.jobresultdekho.com') {
        return 301 https://jobresultdekho.com$request_uri;
    }

    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# api.jobresultdekho.com — Strapi backend
server {
    listen 80;
    server_name api.jobresultdekho.com;
    return 301 https://api.jobresultdekho.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.jobresultdekho.com;

    ssl_certificate     /etc/letsencrypt/live/api.jobresultdekho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jobresultdekho.com/privkey.pem;

    # Allow large file uploads (images, PDFs, etc.)
    client_max_body_size 100M;

    location / {
        proxy_pass         http://localhost:1337;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Prevent timeout on slow/large uploads
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
    }
}
